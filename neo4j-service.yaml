apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
spec:
  type: NodePort
  selector:
    app: neo4j
  ports:
    - name: http
      protocol: TCP
      port: 7474
      targetPort: 7474
      nodePort: 31744
    - name: bolt
      protocol: TCP
      port: 7687
      targetPort: 7687
      nodePort: 31745
